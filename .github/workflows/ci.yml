name: Scaffold SaaS CI/CD (Cloud Runner)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Build, Test & Architecture Verification (Offloaded from Local Mac)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: design-os/package-lock.json

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Frontend Dependencies
        working-directory: ./design-os
        run: npm ci

      - name: Offloaded TypeScript Compilation & Typecheck
        working-directory: ./design-os
        run: npx tsc -b

      - name: Offloaded Production Bundle Build
        working-directory: ./design-os
        run: npm run build

      - name: Offloaded ESLint Check
        working-directory: ./design-os
        run: npm run lint

      - name: Verify 43 Local Presets Integrity
        working-directory: ./design-os
        run: npm run presets

      - name: Verify Agent OS Standards & Graphify Freshness
        working-directory: ./design-os
        run: |
          echo "Verifying Agent OS standards and Graphify graph integrity..."
          if [ -f ".graphify/graph.json" ]; then
            echo "Graphify graph.json is present and tracked."
          else
            echo "Warning: .graphify/graph.json should be preserved."
          fi

      - name: Run Backend Server Tests (Bun Test)
        working-directory: ./design-os
        run: |
          if [ -d "server" ]; then
            bun test
          else
            echo "Server directory not yet initialized; passing check."
          fi
